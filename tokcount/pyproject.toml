[project]
name = "tokcount"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vojtěch Kaniok", email = "vojtikkaniok@seznam.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "tiktoken>=0.14.0",
    "typer>=0.29.1",
]

[project.scripts]
tokcount = "tokcount:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
